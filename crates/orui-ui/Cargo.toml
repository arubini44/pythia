[package]
name = "orui-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
egui.workspace = true
egui_extras = { workspace = true, features = ["svg"] }
orui-data.workspace = true
orui-db.workspace = true
serde_json = "1"
orui-plsql.workspace = true

[dev-dependencies]
resvg = { version = "0.45", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
