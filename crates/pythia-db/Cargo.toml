[package]
name = "pythia-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Spike (#13): run on the pure-Rust oracledb driver instead of the Instant
# Client (`cargo run -p pythia-app --features pythia-db/thin`).
thin = ["dep:oracledb"]

[dependencies]
futures-util.workspace = true
mysql.workspace = true
oracle.workspace = true
oracledb = { workspace = true, optional = true }
pythia-config.workspace = true
pythia-plsql.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiberius.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tokio-util.workspace = true
tracing.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
oracledb.workspace = true
