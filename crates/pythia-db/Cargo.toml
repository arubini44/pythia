[package]
name = "pythia-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The Oracle Instant Client (ODPI-C) instead of the pure-Rust driver, for
# setups the thin driver can't handle (Native Network Encryption required by
# the server, 11.2): `cargo build -p pythia-app --features pythia-db/thick`.
thick = ["dep:oracle"]

[dependencies]
oracle = { workspace = true, optional = true }
oracledb.workspace = true
pythia-config.workspace = true
pythia-plsql.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[[example]]
name = "thin_probe"
# Compares the thin driver with the Instant Client.
required-features = ["thick"]
