name: Release

# Builds packages for every platform and publishes them as a GitHub release
# when a version tag is pushed. Each platform comes in two flavors: the
# pure-Rust driver (no Oracle client needed) and `-instantclient`, built with
# `pythia-db/thick` for servers the pure-Rust driver can't reach (Native
# Network Encryption required, 11.2). ODPI-C loads the Instant Client at run
# time, so building needs no client.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: ${{ matrix.platform.name }}${{ matrix.flavor.suffix }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: wix,nsis
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            formats: app,dmg
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            formats: app,dmg
        flavor:
          - suffix: ""
            build: build --release -p pythia-app
          - suffix: -instantclient
            build: build --release -p pythia-app --features pythia-db/thick
    runs-on: ${{ matrix.platform.os }}
    env:
      # The build behind beforePackagingCommand (`cargo package-build`).
      CARGO_ALIAS_PACKAGE_BUILD: ${{ matrix.flavor.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform.target }}${{ matrix.flavor.suffix }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      # AppImage tooling runs through FUSE on the runner.
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build packages
        shell: bash
        run: |
          cargo packager --release -p pythia-app \
            --target ${{ matrix.platform.target }} \
            --formats ${{ matrix.platform.formats }} \
            --out-dir "${{ github.workspace }}/dist"
        env:
          # Optional signing material; see docs/RELEASING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # pythia_0.4.0_amd64.deb -> pythia-instantclient_0.4.0_amd64.deb, so
      # both flavors fit in one release.
      - name: Name the flavor's packages
        if: matrix.flavor.suffix != ''
        shell: bash
        run: |
          shopt -s nullglob
          cd dist
          for f in *.deb *.AppImage *.msi *-setup.exe *.dmg; do
            mv "$f" "${f/_/${{ matrix.flavor.suffix }}_}"
          done
          ls

      - name: Plain binary archive
        shell: bash
        run: |
          bin=pythia
          [ "${{ runner.os }}" = "Windows" ] && bin=pythia.exe
          mkdir -p dist/archive
          # beforePackagingCommand builds for the runner's own target.
          cp "target/release/$bin" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE dist/archive/
          cd dist/archive
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../pythia-${{ github.ref_name }}-${{ matrix.platform.name }}${{ matrix.flavor.suffix }}.zip" .
          else
            tar czf "../pythia-${{ github.ref_name }}-${{ matrix.platform.name }}${{ matrix.flavor.suffix }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pythia-${{ matrix.platform.name }}${{ matrix.flavor.suffix }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.msi
            dist/*-setup.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
