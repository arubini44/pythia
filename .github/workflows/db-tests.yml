# The whole test suite against a fresh Oracle database, through the
# pure-Rust driver. Called by ci.yml (23ai) and db-versions.yml (older
# releases).
#
# Two jobs side by side, each on a runner and a database of its own (#140):
# pythia-app's tests, the longest, and the rest. On one runner the test
# binaries run one after the other, and the four cores also serve the
# database. Within a job they can't run in parallel: the tests share the
# test schema and serialize on in-process locks.
name: Database tests

on:
  workflow_call:
    inputs:
      image:
        description: A gvenzl image, e.g. gvenzl/oracle-free:23-slim
        required: true
        type: string
      service:
        description: The pluggable database's service name
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  db:
    name: db (${{ matrix.part.name }})
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: pythia-app
            packages: -p pythia-app
          - name: others
            packages: --workspace --exclude pythia-app
    runs-on: ubuntu-latest
    services:
      oracle:
        image: ${{ inputs.image }}
        env:
          ORACLE_PASSWORD: oracle
          APP_USER: pythia
          APP_USER_PASSWORD: pythia
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
    env:
      PYTHIA_TEST_DB: pythia/pythia@localhost:1521/${{ inputs.service }}
      PYTHIA_TEST_DB_DBA: system/oracle@localhost:1521/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The two parts build different test binaries.
          key: ${{ matrix.part.name }}
      - run: cargo test ${{ matrix.part.packages }} --no-run
      # The debugger tests make the database connect back to the test
      # process: from the container, this machine is the network's gateway.
      - name: Address the database reaches this machine at
        run: |
          gateway=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' ${{ job.services.oracle.id }})
          echo "PYTHIA_DEBUG_HOST=$gateway" >> "$GITHUB_ENV"
      - run: cargo test ${{ matrix.part.packages }} --no-fail-fast
