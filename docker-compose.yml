# Oracle Free for local development and integration tests.
#
#   podman compose up -d   (or docker compose up -d)
#   PYTHIA_TEST_DB=pythia/pythia@localhost:1521/FREEPDB1 cargo test -p pythia-db
services:
  oracle:
    image: docker.io/gvenzl/oracle-free:23-slim
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: pythia
      APP_USER_PASSWORD: pythia
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
  # MySQL for the MySQL backend:
  #   podman compose up -d mysql
  #   PYTHIA_TEST_MYSQL=pythia/pythia@localhost:3306/pythia cargo test -p pythia-db
  mysql:
    image: docker.io/library/mysql:9.4.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: pythia
      MYSQL_USER: pythia
      MYSQL_PASSWORD: pythia
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 30
  # PostgreSQL for the PostgreSQL backend (PYTHIA_POSTGRES_PORT if 5432 is
  # taken):
  #   podman compose up -d postgres
  #   PYTHIA_TEST_POSTGRES=pythia/pythia@localhost:5432/pythia cargo test -p pythia-db
  postgres:
    image: docker.io/library/postgres:18
    ports:
      - "${PYTHIA_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: pythia
      POSTGRES_PASSWORD: pythia
      POSTGRES_DB: pythia
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pythia", "-d", "pythia"]
      interval: 10s
      timeout: 5s
      retries: 30
  # SQL Server for the SQL Server backend; mssql-init adds the database and
  # login pythia/pythia once it is up:
  #   podman compose up -d mssql mssql-init
  #   PYTHIA_TEST_MSSQL=pythia/pythia@localhost:1433/pythia cargo test -p pythia-db
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Pythia-2026
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "Pythia-2026", "-Q", "select 1", "-b", "-o", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -S
      - mssql
      - -U
      - sa
      - -P
      - Pythia-2026
      - -b
      - -Q
      - >-
        if db_id('pythia') is null create database pythia;
        if suser_id('pythia') is null create login pythia with password = 'pythia', check_policy = off, default_database = pythia;
        exec('use pythia; if user_id(''pythia'') is null create user pythia for login pythia; alter role db_owner add member pythia;')
    restart: "no"
volumes:
  oracle-data:
  mysql-data:
  postgres-data:
  mssql-data:
