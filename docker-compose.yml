# Oracle Free for local development and integration tests.
#
#   podman compose up -d   (or docker compose up -d)
#   ORUI_TEST_DB=orui/orui@localhost:1521/FREEPDB1 cargo test -p orui-db
services:
  oracle:
    image: docker.io/gvenzl/oracle-free:23-slim
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: orui
      APP_USER_PASSWORD: orui
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  oracle-data:
