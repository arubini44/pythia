[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
pythia-config = { path = "crates/pythia-config" }
pythia-compare = { path = "crates/pythia-compare" }
pythia-data = { path = "crates/pythia-data" }
pythia-db = { path = "crates/pythia-db" }
pythia-debugger = { path = "crates/pythia-debugger" }
pythia-lsp-core = { path = "crates/pythia-lsp-core" }
pythia-monitor = { path = "crates/pythia-monitor" }
pythia-plsql = { path = "crates/pythia-plsql" }
pythia-ui = { path = "crates/pythia-ui" }

eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
oracle = "0.6"
logos = "0.16"
regex = "1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "4"
anyhow = "1"
thiserror = "2"
insta = "1"

# Keep dev builds small and fast: full debug info only for our own crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
