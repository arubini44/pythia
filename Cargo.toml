[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
pythia-ai = { path = "crates/pythia-ai" }
pythia-config = { path = "crates/pythia-config" }
pythia-compare = { path = "crates/pythia-compare" }
pythia-data = { path = "crates/pythia-data" }
pythia-db = { path = "crates/pythia-db" }
pythia-debugger = { path = "crates/pythia-debugger" }
pythia-lsp-core = { path = "crates/pythia-lsp-core" }
pythia-monitor = { path = "crates/pythia-monitor" }
pythia-plsql = { path = "crates/pythia-plsql" }
pythia-ui = { path = "crates/pythia-ui" }

eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
# Only for `--features pythia-db/thick` (ODPI-C, needs the Instant Client).
oracle = "0.6"
# The pure-Rust driver: our fork of oracle/rust-oracledb (branch `pythia`),
# upstream main plus fixes that aren't released yet and Connection::cancel()
# (#13). Pinned to a commit.
oracledb = { git = "https://github.com/ortic/rust-oracledb", rev = "3698e76d3c01d5d0afce5b3e3496d0ef13d2d3a3" }
logos = "0.16"
regex = "1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "4"
anyhow = "1"
thiserror = "2"
insta = "1"
serde_json = "1"
# Blocking HTTP for the AI backends (rustls, no async runtime).
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Keep dev builds small and fast: full debug info only for our own crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
